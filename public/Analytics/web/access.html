ackground:#1a73e8;color:#fff;font-weight:600;font-size:14px;cursor:pointer}.btn:disabled{background:#9aa0a6;cursor:default}.foot{text-align:center;margin-top:14px;font-size:11px;color:#80868b}</style></head><body><div class="wrap"><div class="brand"><div class="logo"><i></i><i></i><i></i></div><b>Analytics access</b></div><div class="card"><h1>Verify your analytics access</h1><div class="sub">You were invited to view analytics reports for <b>nicoofurniture.co.ke</b>. We’ll verify this invitation before opening the portal.</div><div class="property"><div class="avatar" id="avatar">?</div><div><b id="emailLabel">Checking invitation…</b><small>Viewer access · nicoofurniture.co.ke</small></div></div><div class="status" id="status">Verifying invite…</div><button class="btn" id="continue" disabled>Continue to Analytics</button></div><div class="foot">Google analytics portal.</div></div><script src="portal-session.js"></script><script>const q=new URLSearchParams(location.search),email=(q.get('email')||'').trim().toLowerCase(),token=q.get('token')||'',status=document.getElementById('status'),btn=document.getElementById('continue'),label=document.getElementById('emailLabel'),avatar=document.getElementById('avatar');label.textContent=email||'No invited email found';avatar.textContent=((email.split('@')[0].match(/[A-Za-z0-9]/)||['?'])[0]).toUpperCase();async function verify(){if(!email||!token){status.className='status bad';status.textContent='This invitation link is incomplete.';return}try{const r=await fetch('verify-invite',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,token})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok)throw new Error(data.error||'Invitation could not be verified');status.className='status ok';status.textContent='Invitation verified. You can open the analytics portal.';btn.disabled=false;btn.onclick=()=>{PortalSession.set(data.email,data.role);location.replace('Analytics%20_%20Reports%20snapshot.htm
